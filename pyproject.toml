[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosense_net"
version = "1.0.0"
description = "Research-grade multimodal emotion recognition from MELD"
authors = [{ name = "NeuroSense-Net Contributors" }]
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["ruff>=0.6.0"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
